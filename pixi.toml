[workspace]
authors = ["Scott Henderson <scottyhq@gmail.com>"]
channels = ["conda-forge", "nodefaults"]
name = "hyp3-isce2"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Execute on Local Machine
test-local= { cmd = """
    cd /tmp &&
    python -m hyp3_isce2 ++process insar_tops_fufiters \
      S1A_IW_SLC__1SDV_20190101T121401_20190101T121429_025284_02CBEB_65D7 \
      S1A_IW_SLC__1SDV_20190113T121401_20190113T121429_025459_02D234_3311 \
      --burstId 012_023790_IW1 \
      --looks 20x4 \
      --apply-water-mask False
"""}
# Execute on GitHub Runners
test-remote = "gh -R relativeorbit/fufiters workflow run nightly_test.yml"
process-year = { cmd = """
    gh -R relativeorbit/fufiters workflow run insar_timeseries.yml \
        -f year=2023 \
        -f burstId=012_023790_IW1
"""}

[dependencies]
python = ">=3.11.6,<3.12"
numpy = ">=1.26.4,<2"
pip = ">=25.0.1,<26"
isce2 = ">=2.6.3,<3"
dem_stitcher = ">=2.5.12,<3"
rasterio = ">=1.3.6,<2"
shapely = ">=2.0.1,<3"
jinja2 = ">=3.1.6,<4"
asf_search = ">=8.1.1,<9"
gdal = ">=3.6.3,<4"
hyp3lib = ">=3.1.4,<4"
aiohttp = ">=3.11.16,<4"
fsspec = ">=2025.3.2,<2026"
pyarrow = ">=12.0.1,<13"
xmlschema = ">=3.4.5,<4"
xmltodict = ">=0.14.2,<0.15"

[pypi-dependencies]
hyp3_isce2 = { path = ".", editable = true }
